# Nginx reverse proxy — shared across all app stacks
# Requires the shared proxy network to exist: docker network create proxy_net
services:
  nginx:
    build: nginx
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - letsencrypt_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - proxy_net

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - letsencrypt_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >-
      /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'

volumes:
  letsencrypt_certs:
  certbot_www:

networks:
  proxy_net:
    external: true
