events {}

http {
    # --- Upstreams ---
    upstream games_app {
        server web:5000;
    }

    # Add more upstreams here for additional apps, e.g.:
    # upstream another_app {
    #     server another_app:PORT;
    # }

    # HTTP: serve ACME HTTP-01 challenge files, redirect everything else to HTTPS
    server {
        listen 80;
        server_name thomasjunge.de;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS reverse proxy
    server {
        listen 443 ssl;
        server_name thomasjunge.de;

        # Trusted certificate issued by Let's Encrypt (see nginx/init-letsencrypt.sh)
        ssl_certificate     /etc/letsencrypt/live/thomasjunge.de/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/thomasjunge.de/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Games app
        location / {
            proxy_pass         http://games_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Add routes for additional apps here, e.g.:
        # location /other/ {
        #     proxy_pass http://another_app/;
        #     proxy_set_header Host $host;
        # }
    }
}
