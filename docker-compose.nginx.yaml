# Nginx reverse proxy — shared across all app stacks
# Requires the shared proxy network to exist: docker network create proxy_net
services:
  nginx:
    build: nginx
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SSL_IP: ${SSL_IP}
    volumes:
      - nginx_ssl_certs:/etc/nginx/ssl
    restart: unless-stopped
    networks:
      - proxy_net

volumes:
  nginx_ssl_certs:

networks:
  proxy_net:
    external: true
