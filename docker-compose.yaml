# App stack: web, db
# Requires the shared proxy network to exist: docker network create proxy_net
services:
  web:
    build: ./app
    container_name: gamingapp_web
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL}
      SECRET_KEY: ${SECRET_KEY}
      LOGIN_USERNAME: ${LOGIN_USERNAME}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD}
    networks:
      - app_net
      - proxy_net
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: gamingapp_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5435:5432"
    networks:
      - app_net
    restart: unless-stopped

volumes:
  postgres_data_volume:

networks:
  app_net:
  proxy_net:
    external: true